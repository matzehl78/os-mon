# Signierte Release-Bundles (AAB) für Google Play: Handy-App und Wear-OS-App. Nur manuell starten.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (store/checkliste.md)
name: Android Release

on:
  workflow_dispatch:
    inputs:
      versionCode: { description: "versionCode (ganze Zahl, jedes Mal höher)", required: true, default: "1" }
      versionName: { description: "versionName, z. B. 1.0.0", required: true, default: "1.0.0" }

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "Secret ANDROID_KEYSTORE_BASE64 fehlt (siehe store/checkliste.md)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Bauen (AAB)
        env:
          OSMON_KEYSTORE: ${{ runner.temp }}/upload.jks
          OSMON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OSMON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OSMON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          OSMON_VERSION_CODE: ${{ inputs.versionCode }}
          OSMON_VERSION_NAME: ${{ inputs.versionName }}
        run: gradle --no-daemon :app:bundleRelease :wear:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: osmon-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/bundle/release/*.aab
