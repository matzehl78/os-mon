# Startet die Android-App im Emulator (nach dem Onboarding) und zeigt Abstürze samt Fehlerprotokoll. Nur manuell.
name: Android Startcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle --no-daemon :app:assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: bash ci/startcheck.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startcheck
          path: android/startcheck-out/
