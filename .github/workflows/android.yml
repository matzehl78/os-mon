# Baut die Android-App und lässt die JVM-Unit-Tests laufen (bei jedem Push und manuell).
name: Android

on:
  push:
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"       # wie gradle-wrapper.properties (Wrapper-JAR liegt nicht im Repo)
      - name: Bauen
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug :parents:assembleDebug
      - name: Unit-Tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Testübersicht
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              n, fl, er, sk = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              t += n; f += fl; e += er; s += sk
              print(f"{r.get('name')}: {n} Tests, {fl + er} Fehler")
          print(f"GESAMT: {t} Tests, {f + e} Fehler, {s} übersprungen")
          PY
      - name: Testberichte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests
          path: android/app/build/reports/tests/
      - name: Debug-APK
        uses: actions/upload-artifact@v4
        with:
          name: osmon-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
            android/parents/build/outputs/apk/debug/*.apk
      - name: Debug-APK als Download (Release „debug-latest“)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk OS-Mon-debug.apk
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create debug-latest OS-Mon-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "OS-Mon Debug-APK" --notes "Testversion zum Installieren auf dem Handy (Commit $GITHUB_SHA)."
