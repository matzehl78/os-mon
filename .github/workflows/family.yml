name: Family API
on:
  push:
    paths: ["family-server/**", ".github/workflows/family.yml"]
  pull_request:
    paths: ["family-server/**", ".github/workflows/family.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s family-server -v
