# Erzeugt das Xcode-Projekt (XcodeGen), baut für den Simulator ohne Signatur und lässt die Tests laufen.
name: iOS

on:
  push:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel   # arm64-Runner hatten Kapazitätsengpässe
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: XcodeGen
        run: brew install xcodegen && xcodegen
      - name: Simulator wählen
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
      - name: Bauen und testen
        run: |
          set +e
          xcodebuild test -project OSMon.xcodeproj -scheme OSMon \
            -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > xcodebuild.log 2>&1
          rc=$?
          grep -E "error:|Test Case .* failed|Executed [0-9]+ test|\*\* (BUILD|TEST)" xcodebuild.log | sort -u | head -200
          exit $rc
      - name: Apple Watch bauen
        run: |
          set +e
          xcodebuild build -project OSMon.xcodeproj -scheme OSMonWatch \
            -destination "generic/platform=watchOS Simulator" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > watch.log 2>&1
          rc=$?
          grep -E "error:|\*\* BUILD" watch.log | sort -u | head -100
          exit $rc
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: |
            ios/xcodebuild.log
            ios/watch.log
