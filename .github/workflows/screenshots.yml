# Baut die iOS-App, startet sie im Simulator mit Beispiel-Zuständen (DemoMode.swift)
# und legt die Bildschirmfotos im Branch "screenshots" ab (Ordner ios/).
name: Screenshots

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/screenshots.yml", "ios/OSMon/App/DemoMode.swift"]

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: XcodeGen
        run: brew install xcodegen && xcodegen
      - name: Simulator wählen und starten
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pref=[x for x in c if x['name'] in ('iPhone 16 Pro','iPhone 16','iPhone 15 Pro')]
          print((pref or c)[0]['udid'])")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
      - name: Bauen
        run: |
          xcodebuild build -project OSMon.xcodeproj -scheme OSMon -configuration Debug \
            -destination "id=$SIM" -derivedDataPath DD CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:" build.log | head -50; exit 1; }
          xcrun simctl install "$SIM" DD/Build/Products/Debug-iphonesimulator/OSMon.app
      - name: Fotos
        run: |
          mkdir -p shots
          shot() {   # name, Aussehen, Argumente …
            name=$1; look=$2; shift 2
            xcrun simctl ui "$SIM" appearance "$look"
            xcrun simctl terminate "$SIM" com.example.osmon 2>/dev/null || true
            xcrun simctl launch "$SIM" com.example.osmon "$@" > /dev/null
            sleep 7
            xcrun simctl io "$SIM" screenshot "shots/$name.png"
            echo "✓ $name"
          }
          shot 01_neonstadt_lumo        light -OSMonDemo home -OSMonScene neonstadt   -OSMonFigure lumo     -OSMonMood radiant -OSMonUnlock YES
          shot 02_zauberwald_lila       light -OSMonDemo home -OSMonScene zauberwald  -OSMonFigure lila     -OSMonMood content
          shot 03_raumstation_kasto     light -OSMonDemo home -OSMonScene raumstation -OSMonFigure kasto    -OSMonMood tired
          shot 04_unterwasser_tropfi    light -OSMonDemo home -OSMonScene unterwasser -OSMonFigure tropfi   -OSMonMood radiant
          shot 05_mondbasis_orbo        dark  -OSMonDemo home -OSMonScene mondbasis   -OSMonFigure orbo     -OSMonMood sick
          shot 06_suess_sunni           light -OSMonDemo home -OSMonScene suess       -OSMonFigure sunni    -OSMonMood content
          shot 07_zen_wolki             light -OSMonDemo home -OSMonScene zen         -OSMonFigure wolki    -OSMonMood radiant
          shot 08_ohne_minto            light -OSMonDemo home -OSMonScene none        -OSMonFigure minto    -OSMonMood content
          shot 11_wochenrueckblick      light -OSMonDemo home -OSMonScene garteninsel -OSMonFigure glut     -OSMonMood radiant -OSMonReview YES -OSMonScroll review
          shot 12_entwicklung_rauti     light -OSMonDemo home -OSMonScene studio      -OSMonFigure rauti    -OSMonMood radiant -OSMonEvent YES
          shot 13_abendkarte_lumo       dark  -OSMonDemo home -OSMonScene neonstadt   -OSMonFigure lumo     -OSMonMood content -OSMonBedtimeCard YES -OSMonScroll bedtime
          shot 14_gute_nacht_lumo       dark  -OSMonDemo bedtime -OSMonScene neonstadt -OSMonFigure lumo
          shot 15_geschichte            light -OSMonDemo story -OSMonFigure lumo
          shot 16_schlaflieder          light -OSMonDemo songs
          shot 17_guten_morgen_minto    light -OSMonDemo home -OSMonScene garteninsel -OSMonFigure minto    -OSMonMood radiant -OSMonMorning YES -OSMonScroll morning
          shot 18_geburtstag_lumo       light -OSMonDemo home -OSMonScene neonstadt   -OSMonFigure lumo     -OSMonMood radiant -OSMonFestival birthday -OSMonSeason summer
          shot 19_weihnachten_lila      light -OSMonDemo home -OSMonScene zauberwald  -OSMonFigure lila     -OSMonMood radiant -OSMonFestival christmas -OSMonSeason winter
          shot 20_ostern_minto          light -OSMonDemo home -OSMonScene garteninsel -OSMonFigure minto    -OSMonMood radiant -OSMonFestival easter -OSMonSeason spring
          shot 21_halloween_glut        dark  -OSMonDemo home -OSMonScene mondbasis   -OSMonFigure glut     -OSMonMood content -OSMonFestival halloween -OSMonSeason autumn
          shot 22_fasching_sunni        light -OSMonDemo home -OSMonScene suess       -OSMonFigure sunni    -OSMonMood radiant -OSMonFestival carnival -OSMonSeason winter
          shot 23_st_martin_kasto       dark  -OSMonDemo home -OSMonScene zen         -OSMonFigure kasto    -OSMonMood content -OSMonFestival stMartin -OSMonSeason autumn
          shot 24_schluepftag_orbo      light -OSMonDemo home -OSMonScene studio      -OSMonFigure orbo     -OSMonMood radiant -OSMonFestival hatchday -OSMonSeason spring -OSMonScroll festival
          shot 00_logo                  light -OSMonDemo logo
          shot 25_fruehling_lila        light -OSMonDemo home -OSMonScene garteninsel -OSMonFigure lila     -OSMonMood radiant -OSMonSeason spring
          shot 26_sommer_sunni          light -OSMonDemo home -OSMonScene zen         -OSMonFigure sunni    -OSMonMood radiant -OSMonSeason summer
          shot 27_herbst_kasto          light -OSMonDemo home -OSMonScene zauberwald  -OSMonFigure kasto    -OSMonMood content -OSMonSeason autumn
          shot 28_winter_wolki          light -OSMonDemo home -OSMonScene neonstadt   -OSMonFigure wolki    -OSMonMood content -OSMonSeason winter
          shot 29_advent_minto          dark  -OSMonDemo home -OSMonScene zimmer      -OSMonFigure minto    -OSMonMood content -OSMonFestival advent -OSMonSeason winter
          shot 30_silvester_rauti       dark  -OSMonDemo home -OSMonScene neonstadt   -OSMonFigure rauti    -OSMonMood radiant -OSMonFestival silvester -OSMonSeason winter
          shot 31_hintergrundbild_lila  light -OSMonDemo wallpaper -OSMonScene zauberwald -OSMonFigure lila -OSMonMood radiant
          shot 32_aufgaben_lumo         light -OSMonDemo home -OSMonScene garteninsel -OSMonFigure lumo -OSMonMood radiant -OSMonTasks YES -OSMonScroll tasks
          shot 33_aufgaben_verwalten    light -OSMonDemo tasks -OSMonFigure lumo
          shot 34_miteinander           light -OSMonDemo kindness -OSMonFigure lumo
          shot 09_einstellungen         light -OSMonDemo settings
          shot 10_onboarding            light -OSMonDemo onboarding
      - name: In Branch "screenshots" ablegen
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir ios && mv *.png ios/
          git add -A && git commit -qm "iOS-Screenshots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
