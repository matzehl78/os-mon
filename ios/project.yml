# OS-Mon iOS-Projekt (XcodeGen). Erzeugen:  brew install xcodegen  &&  xcodegen
# Danach OSMon.xcodeproj öffnen, unter "Signing & Capabilities" das eigene Team wählen
# (oder unten DEVELOPMENT_TEAM eintragen) und Bundle-IDs/App Group auf die eigene Domain ändern.
#
# App Group, Bundle-IDs und Hintergrund-ID müssen zu ScreenTimeShared.swift (STShared.appGroup)
# und PushResponder.swift (PetBackgroundRefresh.identifier) passen.

name: OSMon
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # eigene Team-ID eintragen
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # iPhone

targets:
  OSMon:
    type: application
    platform: iOS
    sources:
      - OSMon/App
      - OSMon/Shared/Logic
      - OSMon/Shared/Sync
      - OSMon/Shared/Push
      - OSMon/Shared/Watch
    dependencies:
      - target: OSMonWidget
      - target: OSMonWatch           # Apple-Watch-App wird mit eingebettet
      - target: OSMonMonitor
      - sdk: HealthKit.framework
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: OS-Mon
    info:
      path: OSMon/App/Info.plist
      properties:
        CFBundleDisplayName: OS-Mon
        UILaunchScreen: { UIColorName: LaunchBackground, UIImageName: LaunchPet }   # weiß wie der Logo-Film, Lumo in der Mitte
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.osmon.refresh]
        NSHealthShareUsageDescription: "OS-Mon liest nur deine tägliche Schrittzahl. Daraus wird die Vitalität deines Wesens. Nichts verlässt dein Gerät."
        NSHealthUpdateUsageDescription: "OS-Mon schreibt keine Gesundheitsdaten."
        NSPhotoLibraryAddUsageDescription: "OS-Mon speichert nur das Hintergrundbild mit deinem Wesen, wenn du „Bild sichern“ wählst."
    entitlements:
      path: OSMon/App/OSMon.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.osmon]
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true

  OSMonWidget:
    type: app-extension
    platform: iOS
    sources:
      - OSMon/Widget
      - OSMon/Shared/Logic
      - OSMon/Shared/Sync
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon.widget
    info:
      path: OSMon/Widget/Info.plist
      properties:
        CFBundleDisplayName: OS-Mon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OSMon/Widget/OSMonWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.osmon]

  OSMonMonitor:
    type: app-extension
    platform: iOS
    sources:
      - OSMon/Monitor
      - OSMon/Shared/Logic/ScreenTimeShared.swift
      - OSMon/Shared/Logic/PushPolicy.swift
      - OSMon/Shared/Push
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon.monitor
    info:
      path: OSMon/Monitor/Info.plist
      properties:
        CFBundleDisplayName: OS-Mon Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).OSMonMonitor
    entitlements:
      path: OSMon/Monitor/OSMonMonitor.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.osmon]
        com.apple.developer.family-controls: true

  # Apple Watch: eigenständige SwiftUI-App (watchOS 10), Daten vom iPhone über WatchConnectivity.
  OSMonWatch:
    type: application
    platform: watchOS
    sources:
      - OSMon/Watch
      - OSMon/Shared/Watch
      - OSMon/Shared/Logic/PetCore.swift
      - OSMon/Shared/Logic/PetDisplay.swift
      - OSMon/Shared/Logic/ScreenTimeShared.swift
      - OSMon/Shared/Logic/DayTasks.swift
      - OSMon/Shared/Logic/Festivals.swift
      - OSMon/Shared/Logic/Growth.swift
      - OSMon/Shared/Logic/Wardrobe.swift
      - OSMon/Shared/Sync/PetFigure.swift
      - OSMon/Shared/Sync/PetFigureData.swift
      - OSMon/Shared/Sync/PetAccessory.swift
      - OSMon/Shared/Sync/PetReaction.swift
    dependencies:
      - target: OSMonWatchWidget
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: OSMon/Watch/Info.plist
      properties:
        CFBundleDisplayName: OS-Mon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.osmon
    entitlements:
      path: OSMon/Watch/OSMonWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.osmon]

  # Komplikationen fürs Zifferblatt (WidgetKit auf der Uhr)
  OSMonWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - OSMon/WatchWidget
      - OSMon/Shared/Watch
      - OSMon/Shared/Logic/PetCore.swift
      - OSMon/Shared/Logic/PetDisplay.swift
      - OSMon/Shared/Logic/ScreenTimeShared.swift
      - OSMon/Shared/Logic/DayTasks.swift
      - OSMon/Shared/Logic/Festivals.swift
      - OSMon/Shared/Logic/Growth.swift
      - OSMon/Shared/Logic/Wardrobe.swift
      - OSMon/Shared/Sync/PetFigure.swift
      - OSMon/Shared/Sync/PetFigureData.swift
      - OSMon/Shared/Sync/PetAccessory.swift
      - OSMon/Shared/Sync/PetReaction.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: OSMon/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: OS-Mon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OSMon/WatchWidget/OSMonWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.osmon]

  # Unit-Tests ohne Host-App: die reinen Kerne werden direkt mitkompiliert.
  OSMonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OSMonTests
      - OSMon/Shared/Logic
      - OSMon/Shared/Sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.osmon.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OSMonWatch:
    build:
      targets:
        OSMonWatch: all
  OSMon:
    build:
      targets:
        OSMon: all
        OSMonTests: [test]
    test:
      targets: [OSMonTests]
