<title>Lumi schlüpft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Ein-Bild-Bühne: schwarzer Studiohintergrund wie die Vorlagen, Steuerleiste unten */
:root{
  --bg:#050608; --panel:rgba(14,18,20,.72); --fg:#f4ece4; --muted:#9aa7a3;
  --teal:#35e6bd; --peach:#f6cfa6;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(5,6,8,.92),rgba(5,6,8,0))}
.title{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.title h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4vw,34px);letter-spacing:.01em;color:var(--peach);text-wrap:balance}
.title p{margin:4px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:600 12px/1 var(--f-ui);letter-spacing:.04em;padding:8px 12px;border-radius:999px;border:1px solid rgba(53,230,189,.28);
  background:var(--panel);color:var(--muted);cursor:pointer}
.chip[aria-current="true"]{color:#06201a;background:var(--teal);border-color:var(--teal)}
.chip:focus-visible,.btn:focus-visible,#scrub:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;max-width:880px;width:100%;margin:0 auto}
.btn{flex:none;font:600 13px/1 var(--f-ui);padding:9px 12px;border-radius:10px;border:1px solid rgba(246,207,166,.25);
  background:var(--panel);color:var(--fg);cursor:pointer}
#scrub{flex:1;min-width:0;accent-color:var(--teal)}
#time{flex:none;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:72px;text-align:right}
</style>

<!--THREE-->
<script>
(() => {
"use strict";
const T = THREE;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------- Ablauf (Sekunden) ----------------
const SEG = [
  { k: "egg",   t: 0,    title: "Das Ei",     sub: "Es leuchtet …" },
  { k: "crack", t: 4,    title: "Es wackelt", sub: "Risse" },
  { k: "hatch", t: 7.5,  title: "Geschlüpft!", sub: "Noch ganz nass" },
  { k: "baby",  t: 14,   title: "Baby",       sub: "Stufe 1" },
  { k: "child", t: 20,   title: "Kind",       sub: "Stufe 2" },
  { k: "teen",  t: 26,   title: "Jugend",     sub: "Stufe 3" },
  { k: "adult", t: 32,   title: "Erwachsen",  sub: "Stufe 4" },
];
const DUR = 40;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------- Renderer, Szene ----------------
const canvas = document.getElementById("stage");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new T.Scene();
scene.background = new T.Color(0x050608);
const camera = new T.PerspectiveCamera(32, 1, 0.1, 100);

// Umgebung für Glanz (Studio: Softbox oben, Kante türkis)
(() => {
  const env = new T.Scene();
  env.add(new T.Mesh(new T.SphereGeometry(20, 32, 16), new T.MeshBasicMaterial({ color: 0x0a0c10, side: T.BackSide })));
  const box = (c, w, h, x, y, z) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  box(0xffffff, 10, 6, 4, 9, 8); box(0xffe2c8, 6, 8, -10, 3, 4); box(0x3ff0c8, 3, 10, 10, 1, -6); box(0xffffff, 14, 2, 0, -2, 12);
  const pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
})();
scene.add(new T.HemisphereLight(0xfff3e6, 0x1a2a28, 0.55));
const key = new T.DirectionalLight(0xfff0e0, 1.6); key.position.set(3, 6, 5); scene.add(key);
const rim = new T.DirectionalLight(0x8ff5e0, 1.0); rim.position.set(-4, 3, -5); scene.add(rim);
const heartLight = new T.PointLight(0x35e6bd, 0, 4, 2); scene.add(heartLight);

// Hilfs-Texturen
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4; return t; }
const glowTex = canvasTex(128, 128, (g) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.55)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 128, 128); });
const glow = (color, size, op = 1) => { const s = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: op, blending: T.AdditiveBlending, depthWrite: false })); s.scale.setScalar(size); return s; };
const HEART = new Path2D("M0 -0.35 C -0.05 -0.78 -0.78 -0.82 -0.92 -0.3 C -1.02 0.06 -0.62 0.46 0 0.9 C 0.62 0.46 1.02 0.06 0.92 -0.3 C 0.78 -0.82 0.05 -0.78 0 -0.35 Z");
const BOLT = [[0.16, -0.62], [-0.3, 0.1], [-0.02, 0.1], [-0.18, 0.66], [0.3, -0.06], [0.02, -0.06]];
function drawBolt(g) { g.beginPath(); BOLT.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); }

// Boden: weicher Schatten + Pfütze
const shadow = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ map: canvasTex(128, 128, (g) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, "rgba(0,0,0,.85)"); r.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = r; g.fillRect(0, 0, 128, 128); }), transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.002; scene.add(shadow);
const puddle = new T.Mesh(new T.CircleGeometry(1, 48), new T.MeshPhysicalMaterial({ color: 0xbfe9ff, transparent: true, opacity: 0.0, roughness: 0.02, metalness: 0, clearcoat: 1, envMapIntensity: 0.6, depthWrite: false }));
puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.004; puddle.scale.set(1.6, 1.1, 1); scene.add(puddle);

// ================= DAS EI =================
const EGG_H = 1.35, EGG_R = 1.0;                 // halbe Höhe, Radius
const eggR = (y) => { const u = clamp(y / EGG_H, -1, 1); return EGG_R * Math.sqrt(Math.max(0, 1 - u * u)) * (1 - 0.16 * u); };
const splitY = (th) => 0.12 + 0.13 * Math.abs(((th * 9 / Math.PI) % 2) - 1) * 2 - 0.13 + 0.04 * Math.sin(th * 3); // Zickzack
const eggMap = canvasTex(1024, 512, (g, W, H) => {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#f9dcc4"); gr.addColorStop(.5, "#f6c9a6"); gr.addColorStop(1, "#efb894");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // feine Poren
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .08})`; g.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5); }
  // türkise Sprenkel (sternförmig)
  const rnd = mulberry(7);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * W, y = rnd() * H, r = Math.pow(rnd(), 3) * 16 + 2;
    if (Math.abs(x - W / 2) < 120 && Math.abs(y - H * 0.47) < 95) continue;   // Herz frei lassen
    g.save(); g.translate(x, y); g.fillStyle = "rgba(20,190,160,.92)";
    g.beginPath(); g.arc(0, 0, r * 0.62, 0, Math.PI * 2); g.fill();
    if (r > 6) { const n = 9 + (rnd() * 6 | 0); g.lineWidth = Math.max(1, r * 0.12); g.strokeStyle = "rgba(20,190,160,.85)";
      for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + rnd(); g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.1); g.stroke(); } }
    g.restore();
  }
  drawEggHeart(g, W, H, false);
});
function drawEggHeart(g, W, H, emissiveOnly) {
  g.save(); g.translate(W / 2, H * 0.47); g.scale(105, 120);   // Pixel je Einheit, Ei-Verzerrung ausgeglichen
  if (emissiveOnly) { g.shadowColor = "rgba(80,255,210,1)"; g.shadowBlur = 40; }
  g.fillStyle = emissiveOnly ? "rgba(60,240,200,.85)" : "rgba(80,225,195,.95)"; g.fill(HEART);
  g.fillStyle = emissiveOnly ? "#ffffff" : "#eafff9"; g.scale(0.9, 0.9); drawBolt(g);
  g.restore();
}
const eggEmi = canvasTex(1024, 512, (g, W, H) => { g.fillStyle = "#000"; g.fillRect(0, 0, W, H); drawEggHeart(g, W, H, true); });
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/** Eierschale als Teilstück: part "bottom" (unten bis Zickzack) oder "top" */
function shellGeo(part, seg = 96, rows = 40) {
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= seg; j++) {
    const u = j / seg, th = u * Math.PI * 2, ys = splitY(th);
    for (let i = 0; i <= rows; i++) {
      const f = i / rows, y = part === "bottom" ? lerp(-EGG_H, ys, f) : lerp(ys, EGG_H, f);
      const r = eggR(y);
      pos.push(r * Math.sin(th), y, -r * Math.cos(th)); uv.push(u, (y + EGG_H) / (2 * EGG_H));
    }
  }
  for (let j = 0; j < seg; j++) for (let i = 0; i < rows; i++) { const a = j * (rows + 1) + i, b = a + rows + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  const g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new T.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
const shellMat = new T.MeshPhysicalMaterial({ map: eggMap, emissiveMap: eggEmi, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.38, clearcoat: 0.9, clearcoatRoughness: 0.18, sheen: 0, side: T.FrontSide, transparent: true });
const innerMat = new T.MeshStandardMaterial({ color: 0xf2c4bc, roughness: 0.55, side: T.BackSide, transparent: true });
const egg = new T.Group(); scene.add(egg);
const eggBottom = new T.Group(), eggTop = new T.Group(), eggTopPivot = new T.Group();
egg.add(eggBottom); egg.add(eggTopPivot); eggTopPivot.add(eggTop);
eggBottom.add(new T.Mesh(shellGeo("bottom"), shellMat), new T.Mesh(shellGeo("bottom"), innerMat));
eggTop.add(new T.Mesh(shellGeo("top"), shellMat), new T.Mesh(shellGeo("top"), innerMat));
eggTopPivot.position.set(0, splitY(0), -eggR(0.12)); eggTop.position.set(0, -splitY(0), eggR(0.12));   // Scharnier hinten
// Riss-Linie (leuchtet türkis, wird danach zur Schalenkante)
const crackCurve = new T.CatmullRomCurve3(Array.from({ length: 145 }, (_, i) => { const th = i / 144 * Math.PI * 2, y = splitY(th), r = eggR(y) + 0.004; return new T.Vector3(r * Math.sin(th), y, -r * Math.cos(th)); }), true);
const crackGeo = new T.TubeGeometry(crackCurve, 400, 0.022, 6, true);
const crackMat = new T.MeshStandardMaterial({ color: 0xf6dcc8, emissive: 0x3ff0c8, emissiveIntensity: 2, roughness: 0.5 });
const crack = new T.Mesh(crackGeo, crackMat); eggBottom.add(crack);
const crackTop = new T.Mesh(crackGeo, crackMat); eggTop.add(crackTop);
// kleine Seitenrisse
const sideCracks = [];
for (let k = 0; k < 6; k++) {
  const th0 = k / 6 * Math.PI * 2 + 0.4, pts = []; let th = th0, y = splitY(th0);
  for (let s = 0; s < 6; s++) { const r = eggR(y) + 0.004; pts.push(new T.Vector3(r * Math.sin(th), y, -r * Math.cos(th))); th += (s % 2 ? 0.07 : -0.07); y += (k % 2 ? 0.09 : -0.11); }
  const m = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 30, 0.014, 5), crackMat); m.userData.dir = k % 2; (k % 2 ? eggTop : eggBottom).add(m); sideCracks.push(m);
}
// Wassertropfen auf der Schale
const dropMat = new T.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0, clearcoat: 1, envMapIntensity: 3, ior: 1.33, });
const dropGeo = new T.SphereGeometry(1, 16, 12);
{ const rnd = mulberry(3);
  for (let i = 0; i < 26; i++) {
    const th = rnd() * Math.PI * 2, y = lerp(-0.9, 1.15, rnd()), r = eggR(y), s = 0.03 + rnd() * 0.05;
    const d = new T.Mesh(dropGeo, dropMat); const n = new T.Vector3(Math.sin(th), 0.25 * y, -Math.cos(th)).normalize();
    d.position.set(r * Math.sin(th), y, -r * Math.cos(th)).addScaledVector(n, s * 0.25); d.lookAt(d.position.clone().add(n));
    d.scale.set(s, s * 1.35, s * 0.5); (y > splitY(th) ? eggTop : eggBottom).add(d);
  } }
const eggGlow = glow(0x35e6bd, 2.2, 0.35); eggGlow.position.set(0, 0.1, 1.1); egg.add(eggGlow);
// Schalensplitter beim Aufbrechen
const shards = [];
for (let i = 0; i < 7; i++) {
  const th = i * 0.9 + 0.3, w = 0.28 + (i % 3) * 0.06;
  const g = new T.SphereGeometry(EGG_R, 8, 6, th, w, Math.PI * 0.45, 0.32);
  const m = new T.Group(); m.add(new T.Mesh(g, shellMat), new T.Mesh(g, innerMat));
  m.userData = { th, v: new T.Vector3(Math.sin(th) * (1.1 + (i % 2) * 0.5), 2.6 + (i % 3) * 0.6, -Math.cos(th) * 1.2 + 0.9), spin: (i % 2 ? 1 : -1) * (3 + i) };
  m.visible = false; scene.add(m); shards.push(m);
}

// ================= DIE FIGUR (Fell per Schalen-Technik) =================
const LAYERS = 26;
const furU = { uTime: { value: 0 }, uFurLen: { value: 0.12 }, uWet: { value: 0 }, uDens: { value: 70 }, uLightDir: { value: new T.Vector3(0.45, 0.8, 0.55).normalize() } };
const furVS = `
  attribute float aFur; uniform float uLayer, uFurLen, uTime, uWet; uniform vec3 uPS;
  varying vec3 vN, vCol, vP, vW; varying float vFur;
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vec3 wn = normalize(mat3(modelMatrix) * (normal / (uPS * uPS)));
    float L = uFurLen * aFur * (1.0 - 0.5 * uWet);
    float h = uLayer;
    wp.xyz += wn * L * h;
    wp.y -= L * h * h * (0.35 + 0.9 * uWet);
    wp.x += sin(uTime * 1.7 + wp.y * 4.0) * L * h * h * 0.12;
    vP = position * uPS; vN = wn; vCol = color; vFur = aFur; vW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const furFS = `
  uniform float uLayer, uWet, uDens; uniform vec3 uLightDir;
  varying vec3 vN, vCol, vP, vW; varying float vFur;
  float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  void main(){
    float dens = uDens * mix(1.0, 0.33, uWet) * mix(1.6, 1.0, clamp(vFur, 0.0, 1.0));
    if (uLayer > 0.0) {
      vec3 q = vP * dens; vec3 c = floor(q); vec3 f = fract(q) - 0.5;
      float r = h3(c);
      float len = mix(0.35, 1.0, r);
      if (uLayer > len) discard;
      float th = (1.0 - uLayer / len) * mix(0.62, 0.8, uWet);
      if (length(f) > th) discard;
    }
    vec3 N = normalize(vN); vec3 V = normalize(cameraPosition - vW);
    float dif = max(dot(N, uLightDir), 0.0) * 0.7 + 0.3;
    float back = pow(1.0 - max(dot(N, V), 0.0), 2.2);
    float ao = mix(0.5, 1.08, pow(uLayer, 0.7));
    vec3 col = vCol * (0.38 + dif * 0.85) * ao;
    col += back * (0.25 + 0.6 * uLayer) * vec3(1.0, 0.93, 0.86) * 0.6;
    col *= mix(1.0, 0.82, uWet);
    vec3 Hh = normalize(uLightDir + V);
    col += pow(max(dot(N, Hh), 0.0), 40.0) * uWet * 0.7;
    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`;
const layerMats = [];                  // je Teil eigene Materialien (Uniform uPS je Teil), gleiches Programm

/** Teil mit Fell: Einheitskugel, Farbe/Fell-Länge je Ecke über fn(n) -> [hex, fur] */
const lin = (hex) => new T.Color(hex).convertSRGBToLinear();
function furPart(fn, seg = 40) {
  const geo = new T.SphereGeometry(1, seg, Math.round(seg * 0.75));
  const n = geo.attributes.normal, cnt = n.count, col = new Float32Array(cnt * 3), fur = new Float32Array(cnt), v = new T.Vector3();
  for (let i = 0; i < cnt; i++) { v.fromBufferAttribute(n, i); const [c, f] = fn(v); col.set([c.r, c.g, c.b], i * 3); fur[i] = f; }
  geo.setAttribute("color", new T.BufferAttribute(col, 3)); geo.setAttribute("aFur", new T.BufferAttribute(fur, 1));
  const ps = { value: new T.Vector3(1, 1, 1) };
  const mk = (l) => { const m = new T.ShaderMaterial({ uniforms: Object.assign({ uLayer: { value: l }, uPS: ps }, furU), vertexShader: furVS, fragmentShader: furFS, vertexColors: true }); layerMats.push(m); return m; };
  const mesh = new T.Mesh(geo, mk(0)); mesh.frustumCulled = false;
  for (let l = 1; l <= LAYERS; l++) { const s = new T.Mesh(geo, mk(l / LAYERS)); s.frustumCulled = false; s.renderOrder = l; mesh.add(s); }
  mesh.userData.ps = ps;
  return mesh;
}
const PEACH = lin("#f7c48e"), CREAM = lin("#fde6cc"), WHITE = lin("#fffaf5"), PINK = lin("#f59aa4"), TEAL = lin("#22e0b0");
const mixC = (a, b, t) => a.clone().lerp(b, clamp(t));

const pet = new T.Group(); scene.add(pet);
const root = new T.Group(); pet.add(root);          // Skalierung der Stufe
const P = {};
P.body = furPart((n) => [mixC(PEACH, CREAM, ss(0.1, 0.75, n.z) * ss(-0.7, 0.3, n.y)), 1.0]);
P.head = furPart((n) => { const face = ss(0.2, 0.8, n.z) * ss(0.55, -0.15, n.y); return [mixC(PEACH, WHITE, face * 1.1 + ss(0.4, 0.95, n.z) * 0.5), lerp(1.15, 0.35, ss(0.45, 0.95, n.z) * ss(0.7, 0.0, n.y))]; });
P.earL = furPart((n) => [mixC(PEACH, PINK, ss(-0.2, -0.75, n.x) * 0.9), lerp(1.2, 0.5, ss(-0.2, -0.7, n.x))], 28);
P.earR = furPart((n) => [mixC(PEACH, PINK, ss(0.2, 0.75, n.x) * 0.9), lerp(1.2, 0.5, ss(0.2, 0.7, n.x))], 28);
for (const s of ["FL", "FR", "HL", "HR"]) {
  P["leg" + s] = furPart((n) => [mixC(PEACH, CREAM, 0.3 + 0.5 * ss(0, 0.8, n.z)), 0.75], 24);
  P["paw" + s] = furPart((n) => [mixC(CREAM, WHITE, 0.6), 0.55], 24);
}
P.thighL = furPart((n) => [mixC(PEACH, CREAM, 0.2), 1.0], 28);
P.thighR = furPart((n) => [mixC(PEACH, CREAM, 0.2), 1.0], 28);

// ---------------- Zeitachse ----------------
function stateAt(t) {
  const A = { time: t, closed: 0, wet: 0, earFlap: 0, antWob: 0, tailWag: 0, hop: 0, jump: 0, nod: 0, turn: 0, tiltZ: 0, lookUp: 0, lookX: 0, pulse: 0, eyeBig: 1 };
  let L, petPos = V3(0, 0, 0), petVis = true, petRotY = 0;
  // Proportionen je Abschnitt
  const grow = (a, b, t0) => mixLook(LOOK[a], LOOK[b], ss(t0, t0 + 2.2, t));
  if (t < 14) L = LOOK.hatch; else if (t < 14.01) L = LOOK.baby;
  if (t >= 11) L = grow("hatch", "baby", 11);
  if (t >= 20) L = grow("baby", "child", 20);
  if (t >= 26) L = grow("child", "teen", 26);
  if (t >= 32) L = grow("teen", "adult", 32);
  // Herz pulsiert
  A.pulse = 0.5 + 0.5 * Math.sin(t * 3.2);
  // Schlüpfen: Figur steigt aus dem Ei
  if (t < 7.6) { petVis = false; }
  const rise = ss(7.5, 8.6, t);
  petPos.y = lerp(-1.05, -0.62, rise);
  // nass und Augen zu
  A.wet = 1 - ss(11.2, 12.6, t);
  A.closed = 1 - ss(10.0, 10.6, t);
  if (t > 9 && t < 10) A.nod = 0.06 * Math.sin((t - 9) * 6);
  // Abschütteln
  if (t > 11 && t < 12.8) { const k = Math.sin(Math.PI * (t - 11) / 1.8); A.earFlap = 0.35 * k; A.tiltZ = 0.22 * k * Math.sin(t * 24); A.antWob = 0.25 * k; A.tailWag = 0.4 * k; }
  // Sprung aus dem Ei: 12.8–14.0
  if (t >= 12.8) { const j = ss(12.8, 13.8, t); petPos.y = lerp(-0.62, 0, j) + Math.sin(Math.PI * clamp((t - 12.8) / 1.0)) * 1.1; petPos.z = lerp(0, 1.5, j); A.jump = Math.sin(Math.PI * clamp((t - 12.8) / 1.0)); }
  if (t >= 13.8) { petPos.y = 0; petPos.z = 1.5; const k = ss(13.8, 15.5, t); petPos.z = lerp(1.5, 0.3, k); }
  // Leerlauf: blinzeln, umsehen, kleine Hüpfer
  if (t > 12.6) {
    const bl = (t * 0.37) % 1; if (bl < 0.04) A.closed = Math.max(A.closed, Math.sin(Math.PI * bl / 0.04));
    A.turn = 0.18 * Math.sin(t * 0.7); A.lookX = 0.1 * Math.sin(t * 0.9); A.lookUp = 0.08;
    A.tailWag = Math.max(A.tailWag, 0.12);
  }
  // Wachstums-Momente (Funkeln, Herz hell)
  let burst = 0;
  for (const g of [8.0, 20, 26, 32]) { const k = t - g; if (k > 0 && k < 2.4) burst = Math.max(burst, Math.sin(Math.PI * k / 2.4)); }
  A.pulse = Math.max(A.pulse, burst);
  // Hüpfer beim Kind
  if (t > 22.5 && t < 26) { const k = (t - 22.5) % 1.6; A.hop = k < 0.5 ? Math.sin(Math.PI * k / 0.5) : 0; petPos.y += A.hop * 0.25; }
  if (t > 28.5 && t < 32) petRotY = 0.5 * Math.sin((t - 28.5) * 0.9);   // Jugend: dreht sich, zeigt Profil
  // Erwachsen am Ende: zufrieden Augen zu
  if (t > 37.2 && t < 39.2) A.closed = Math.max(A.closed, Math.sin(Math.PI * (t - 37.2) / 2));
  return { L, A, petPos, petVis, petRotY, burst };
}

const tmpQ = new T.Quaternion();
function render(t) {
  const { L, A, petPos, petVis, petRotY, burst } = stateAt(t);

  // ---- Ei ----
  const eggVis = t < 16.5;
  egg.visible = eggVis;
  if (eggVis) {
    let rotZ = 0.035 * Math.sin(t * 2.0), rotX = 0;
    const shake = ss(3.8, 7.2, t) * (1 - ss(7.4, 7.6, t));
    if (!reduce) { rotZ += shake * 0.12 * Math.sin(t * 31) * (0.6 + 0.4 * Math.sin(t * 5)); rotX += shake * 0.05 * Math.sin(t * 23); }
    egg.rotation.set(rotX, 0.35 * Math.sin(t * 0.4) * (1 - ss(7, 8, t)), rotZ * (1 - ss(7.5, 8, t)));
    egg.position.y = EGG_H * 0.92;
    const cr = ss(4.0, 7.3, t);
    crackGeo.setDrawRange(0, Math.floor(crackGeo.index.count * cr / 6) * 6);
    sideCracks.forEach((m, i) => { m.visible = t > 5 + i * 0.3; });
    crackMat.emissiveIntensity = t < 7.5 ? 1.2 + 2.5 * cr * (0.6 + 0.4 * Math.sin(t * 18)) : lerp(2.5, 0, ss(7.5, 9, t));
    // Deckel klappt nach hinten
    const open = ss(7.5, 8.2, t), bounce = t > 8.2 ? 0.08 * Math.exp(-(t - 8.2) * 3) * Math.sin((t - 8.2) * 14) : 0;
    eggTopPivot.rotation.x = -(open * 1.25 + bounce);
    eggTopPivot.position.y = splitY(0) + open * 0.05;
    shellMat.emissiveIntensity = (0.35 + 0.5 * (0.5 + 0.5 * Math.sin(t * 3.2))) * (1 - ss(7.6, 8.4, t)) + cr * 0.8 * (1 - ss(7.6, 8.4, t));
    eggGlow.material.opacity = (0.25 + 0.25 * Math.sin(t * 3.2) + cr * 0.5) * (1 - ss(7.6, 8.4, t));
    const fade = 1 - ss(14.5, 16.4, t); shellMat.transparent = innerMat.transparent = fade < 0.999; shellMat.opacity = fade; innerMat.opacity = fade; dropMat.opacity = 0.45 * Math.max(fade, A.wet);
    egg.position.y -= ss(14.5, 16.4, t) * 0.4;
  }
  dropMat.opacity = egg.visible ? dropMat.opacity : 0.45;
  // Splitter
  shards.forEach((s) => {
    const k = t - 7.55; s.visible = k > 0 && t < 16.4;
    if (!s.visible) return;
    const u = s.userData, kk = Math.min(k, 0.95);
    s.position.set(u.v.x * kk, Math.max(0.05, EGG_H * 0.95 + u.v.y * kk - 4.9 * kk * kk), u.v.z * kk);
    s.rotation.set(u.spin * kk, u.spin * 0.5 * kk, k > 0.95 ? 1.4 : u.spin * 0.3 * kk);
  });
  puddle.material.opacity = 0.16 * ss(7.6, 9, t) * (1 - ss(15, 18, t)); puddle.scale.set(1.2 + ss(7.6, 10, t) * 0.8, 0.9 + ss(7.6, 10, t) * 0.5, 1);
  // ---- Figur ----
  pet.visible = petVis; pet.position.copy(petPos);
  pet.position.y += (t < 12.8 ? EGG_H * 0.92 - 0.55 : 0);
  pet.rotation.set(0, petRotY + (t > 12.8 && t < 13.8 ? Math.sin(Math.PI * (t - 12.8)) * 0.3 : 0), 0);
  pose(L, A);
  heartLight.position.copy(heart.getWorldPosition(new T.Vector3())).add(V3(0, 0, 0.4)); heartLight.intensity = petVis ? 0.12 + 0.3 * A.pulse : 0;
  // Unterkörper im Ei ausblenden (Beine sonst durch die Schale)
  const inEgg = t < 12.8;
  ["legFL", "legFR", "legHL", "legHR", "pawFL", "pawFR", "pawHL", "pawHR", "thighL", "thighR"].forEach((k) => P[k].visible = !inEgg);
  tail.visible = P.pom.visible = !inEgg;
  // Schatten
  const sc = petVis && !inEgg ? 2.2 * L.S + 0.4 : 2.6; shadow.scale.set(sc, sc * 0.7, 1); shadow.position.z = petVis && !inEgg ? pet.position.z : 0;
  shadow.material.opacity = 0.8 - 0.4 * clamp(pet.position.y);
  // Funken
  const pos = sparkGeo.attributes.position.array; const center = petVis ? heart.getWorldPosition(new T.Vector3()) : V3(0, 1.3, 0.5);
  const sk = Math.max(burst, t > 3.8 && t < 7.6 ? ss(3.8, 7.5, t) * 0.5 : 0);
  sparks.material.opacity = sk; sparks.visible = sk > 0.01;
  sparkSeed.forEach(([a, y, r, ph], i) => { const k = (t * 0.6 + ph) % 1, rr = r * (0.4 + k * 1.2); pos[i * 3] = center.x + Math.cos(a + t * 0.8) * rr; pos[i * 3 + 1] = center.y + y * rr * 0.8 + k * 0.6; pos[i * 3 + 2] = center.z + Math.sin(a + t * 0.8) * rr * 0.6; });
  sparkGeo.attributes.position.needsUpdate = true;
  // ---- Kamera ----
  const sz = petVis && !inEgg ? L.S * (L.headY + L.headR + L.antL + 0.6) : 3.4;
  const fy = petVis && !inEgg ? sz * 0.5 : 1.55;
  const dist = (sz * 0.5 + 0.55) / Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * Math.max(1, 1.1 / Math.min(1.1, camera.aspect)) + 0.4;
  const orb = (reduce ? 0 : 0.32 * Math.sin(t * 0.21)) + orbitUser;
  camera.position.set(Math.sin(orb) * dist, fy + dist * 0.12, Math.cos(orb) * dist + (petVis && !inEgg ? pet.position.z : 0));
  camera.lookAt(0, fy - 0.05, petVis && !inEgg ? pet.position.z : 0);
  renderer.render(scene, camera);
}

// ---------------- Steuerung ----------------
let time = 0, playing = true, last = performance.now(), orbitUser = 0, recorder = null;
const chips = document.getElementById("chips"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time");
const ttl = document.getElementById("stTitle"), sub = document.getElementById("stSub"), playBtn = document.getElementById("play"), recBtn = document.getElementById("rec");
SEG.forEach((s, i) => { const b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.id = "chip-" + s.k; b.textContent = s.title.replace("!", ""); b.onclick = () => { time = s.t + 0.01; }; chips.appendChild(b); });
let segIdx = -1;
function hud() {
  let i = 0; SEG.forEach((s, k) => { if (time >= s.t) i = k; });
  if (i !== segIdx) { segIdx = i; ttl.textContent = SEG[i].title; sub.textContent = SEG[i].sub; [...chips.children].forEach((c, k) => c.setAttribute("aria-current", k === i ? "true" : "false")); }
  scrub.value = Math.round(time / DUR * 1000); timeEl.textContent = time.toFixed(1).replace(".", ",") + " s";
}
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "Pause" : "Abspielen"; };
scrub.oninput = () => { time = scrub.value / 1000 * DUR; };
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => { if (drag != null) { orbitUser += (e.clientX - drag) * 0.008; drag = e.clientX; } });
canvas.addEventListener("pointerup", () => { drag = null; });
recBtn.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!canvas.captureStream || !window.MediaRecorder) { recBtn.textContent = "Nicht verfügbar"; return; }
  const type = ["video/webm;codecs=vp9", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
  const chunks = []; recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" })); a.download = "schlupf.webm"; a.click(); recorder = null; recBtn.textContent = "Video"; };
  time = 0; playing = true; playBtn.textContent = "Pause"; recorder.start(); recBtn.textContent = "Stopp";
};
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { time += dt; if (time >= DUR) { if (recorder) recorder.stop(); time = 0; } }
  render(time); hud(); requestAnimationFrame(loop);
}
// Für Tests/Standbilder: window.schlupf.seek(sekunden)
window.schlupf = { seek(t) { time = t; playing = false; render(t); hud(); }, DUR };
requestAnimationFrame(loop);
})();
</script>
